[package]
name = "pdf-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
base64 = "0.23"
dotenvy = "0.15"
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
time = { version = "0.3", features = ["std"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "fs", "io-util", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower_governor = "0.8"
tower-cookies = "0.11"
tower-http = { version = "0.7", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

[dev-dependencies]
tower = "0.5"
