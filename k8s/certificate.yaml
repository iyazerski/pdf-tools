apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pdftools-iyazerski-dev
  labels:
    app.kubernetes.io/part-of: pdf-tools
    app: pdf-tools
spec:
  secretName: pdftools-iyazerski-dev-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - __PUBLIC_HOST__
