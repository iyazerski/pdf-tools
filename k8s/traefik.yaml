apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  labels:
    app: pdf-tools
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  labels:
    app: pdf-tools
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  labels:
    app: pdf-tools
spec:
  compress:
    # PDFs and page previews are already compressed, so only compress text assets.
    includedContentTypes:
      - text/html
      - text/css
      - text/javascript
      - image/svg+xml
      - application/json
      - application/xml
      - text/xml
      - text/plain
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: pdf-tools-transport
  labels:
    app: pdf-tools
spec:
  forwardingTimeouts:
    dialTimeout: 30s
    responseHeaderTimeout: 600s
    idleConnTimeout: 600s
